
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>You're Offline | Sol Ad Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
      text-align: center;
    }

    .container {
      max-width: 420px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      line-height: 1.7;
    }

    button {
      margin-top: 20px;
      padding: 13px 25px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">📡</div>

    <h1>You're Offline!</h1>

    <p>
      It looks like your internet connection is unavailable.
      Please reconnect to the internet and try again.
    </p>

    <button onclick="window.location.reload()">
      Try Again
    </button>
  </div>
</body>
</html>
